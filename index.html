<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Interactive JavaScript To-Do List application with CRUD operations and localStorage.">

    <title>TaskFlow | To-Do List</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <main class="app">

        <section class="todo-container"
                 aria-labelledby="app-title">

            <header class="app-header">

                <p class="label">
                    TASK MANAGEMENT
                </p>

                <h1 id="app-title">
                    TaskFlow
                </h1>

                <p>
                    Organize your tasks and stay productive.
                </p>

            </header>


            <!-- Add Task -->
            <form id="todo-form"
                  class="todo-form">

                <label for="todo-input"
                       class="sr-only">
                    Enter a task
                </label>

                <input type="text"
                       id="todo-input"
                       placeholder="What needs to be done?"
                       autocomplete="off"
                       required>

                <button type="submit"
                        class="add-btn">
                    Add Task
                </button>

            </form>


            <!-- Task Statistics -->
            <div class="task-stats"
                 aria-live="polite">

                <span>
                    Total:
                    <strong id="total-count">0</strong>
                </span>

                <span>
                    Active:
                    <strong id="active-count">0</strong>
                </span>

                <span>
                    Completed:
                    <strong id="completed-count">0</strong>
                </span>

            </div>


            <!-- Filters -->
            <div class="filters"
                 role="group"
                 aria-label="Task filters">

                <button type="button"
                        class="filter-btn active"
                        data-filter="all">
                    All
                </button>

                <button type="button"
                        class="filter-btn"
                        data-filter="active">
                    Active
                </button>

                <button type="button"
                        class="filter-btn"
                        data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- Task List -->
            <ul id="todo-list"
                class="todo-list"
                aria-label="Task list">
            </ul>


            <!-- Empty State -->
            <p id="empty-message"
               class="empty-message">
                No tasks available. Add your first task!
            </p>


            <!-- Clear Completed -->
            <button type="button"
                    id="clear-completed"
                    class="clear-btn">
                Clear Completed
            </button>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
